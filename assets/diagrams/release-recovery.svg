<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1660" viewBox="0 0 1120 1660" role="img" aria-labelledby="title desc"><title id="title">02  Task batches, release, and recovery</title><desc id="desc">Count completed top-level tasks, never commits or subtasks.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54759B"/></marker></defs>
<rect width="1120" height="1660" fill="#F5F8FC"/><rect width="1120" height="142" fill="#13263F"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="48" y="36" font-size="16" font-weight="700" fill="#8EDACC">AGENT-TEAM / CODEX + CLAUDE CODE</text>
<text x="48" y="83" font-size="32" font-weight="700" fill="white">02  Task batches, release, and recovery</text><text x="48" y="120" font-size="18" fill="#C7D5E6">Count completed top-level tasks, never commits or subtasks.</text>
<rect x="60" y="190" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="210" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="228" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Read integrated delivery evidence</text>
<text x="365" y="262" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Preserve the pending task IDs and integration boundaries.</text>
<text x="365" y="288" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">One project owner controls serial release.</text>
<path d="M365 310 V385" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="390" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="410" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="428" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Check run mode and holds</text>
<text x="365" y="462" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Auto-deploy off: report integration and ask to deploy.</text>
<text x="365" y="488" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Project pause or failure hold: no automatic release.</text>
<path d="M365 510 V585" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="590" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="610" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="628" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Wait for a full or final smaller batch</text>
<text x="365" y="662" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Flush the remainder at run end or when all work is blocked.</text>
<text x="365" y="688" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Do not flush while active work can still fill the batch.</text>
<path d="M365 710 V785" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="790" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="810" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="828" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Freeze the exact release boundary</text>
<text x="365" y="862" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Select the oldest eligible completed task IDs.</text>
<text x="365" y="888" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Check artifact delta, preview approval, and target authority.</text>
<path d="M365 910 V985" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="990" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="1010" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="1028" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Submit one batch and verify production</text>
<text x="365" y="1062" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Record the provider operation identity before proceeding.</text>
<text x="365" y="1088" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Inspect uncertain outcomes before any retry.</text>
<path d="M365 1110 V1185" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1190" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="1210" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="1228" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Record delivery and verify cleanup</text>
<text x="365" y="1262" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Record deployed task IDs once; repair tracking without replay.</text>
<text x="365" y="1288" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Stop owned previews and remove only eligible worktrees.</text>
<path d="M365 1310 V1415" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1420" width="610" height="120" rx="18" fill="#E9F8F4" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="1440" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="1458" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Finish or retain pending work</text>
<text x="365" y="1492" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Keep production evidence and unresolved tasks.</text>
<text x="365" y="1518" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Report deployed batches, retained resources, and holds.</text>
<rect x="770" y="190" width="300" height="148" rx="18" fill="#FFF6E7" stroke="#E9C88D" stroke-width="2"/>
<text x="920" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#13263F">Explicit batch size</text>
<text x="920" y="257" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Standalone auto-deploy: 1.</text>
<text x="920" y="283" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">start 3 auto-deploy: 3.</text>
<text x="920" y="309" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Explicit B overrides the size.</text>
<rect x="770" y="460" width="300" height="122" rx="18" fill="#FFF6E7" stroke="#E9C88D" stroke-width="2"/>
<text x="920" y="494" text-anchor="middle" font-size="20" font-weight="700" fill="#13263F">Off or paused</text>
<text x="920" y="527" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Off needs release approval.</text>
<text x="920" y="553" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Pause keeps pending evidence.</text>
<rect x="770" y="750" width="300" height="122" rx="18" fill="#FFF6E7" stroke="#E9C88D" stroke-width="2"/>
<text x="920" y="784" text-anchor="middle" font-size="20" font-weight="700" fill="#13263F">No safe boundary</text>
<text x="920" y="817" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Do not silently deploy</text>
<text x="920" y="843" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">later or unrelated changes.</text>
<rect x="770" y="1030" width="300" height="148" rx="18" fill="#FFF6E7" stroke="#E9C88D" stroke-width="2"/>
<text x="920" y="1064" text-anchor="middle" font-size="20" font-weight="700" fill="#13263F">Failure or unknown</text>
<text x="920" y="1097" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Hold automatic releases.</text>
<text x="920" y="1123" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Inspect and recover safely.</text>
<text x="920" y="1149" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Continue unaffected work only.</text>
<rect x="770" y="1320" width="300" height="122" rx="18" fill="#FFF6E7" stroke="#E9C88D" stroke-width="2"/>
<text x="920" y="1354" text-anchor="middle" font-size="20" font-weight="700" fill="#13263F">Retry needs evidence</text>
<text x="920" y="1387" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Cause resolved; checks pass.</text>
<text x="920" y="1413" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">No unchanged retry loop.</text>
<path d="M670 1250 H720 V450 H675" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<text x="707" y="950" transform="rotate(-90 707 950)" font-size="16" font-weight="700" fill="#137D68">Next pending batch: recheck mode and holds</text>
<rect x="150" y="1367" width="430" height="29" rx="4" fill="#F5F8FC"/>
<text x="365" y="1390" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Otherwise: finish or report the hold</text>
<text x="560" y="1600" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Continuous development may refill independently when safe; deployment remains serial.</text>
<text x="560" y="1630" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Exact command, ownership, approval, and recovery rules are in references/.</text>
</g></svg>
