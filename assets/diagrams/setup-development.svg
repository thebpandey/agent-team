<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1660" viewBox="0 0 1120 1660" role="img" aria-labelledby="title desc"><title id="title">01  Counted and continuous development</title><desc id="desc">One project owner. Up to six occupied teams. Deployment batches are separate.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54759B"/></marker></defs>
<rect width="1120" height="1660" fill="#F5F8FC"/><rect width="1120" height="142" fill="#13263F"/>
<g font-family="DejaVu Sans,Arial,sans-serif"><text x="48" y="36" font-size="16" font-weight="700" fill="#8EDACC">AGENT-TEAM / CODEX + CLAUDE CODE</text>
<text x="48" y="83" font-size="32" font-weight="700" fill="white">01  Counted and continuous development</text><text x="48" y="120" font-size="18" fill="#C7D5E6">One project owner. Up to six occupied teams. Deployment batches are separate.</text>
<rect x="60" y="190" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="210" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="228" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Resolve the requested action</text>
<text x="365" y="262" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Start: resolve defaults and run-only overrides.</text>
<text x="365" y="288" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Use saved auto-deploy without another prompt.</text>
<path d="M365 310 V385" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="390" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="410" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="428" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Admit safe ready tasks</text>
<text x="365" y="462" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Honor the team limit, existing ownership, and host capacity.</text>
<text x="365" y="488" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">A finite run freezes its admitted task IDs.</text>
<path d="M365 510 V585" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="590" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="610" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="628" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Develop, review, and repair</text>
<text x="365" y="662" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Use owned feature worktrees and focused checks.</text>
<text x="365" y="688" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Report each team's ID, name, role, and evidence.</text>
<path d="M365 710 V785" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="790" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="810" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="828" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Check each feature's approval gate</text>
<text x="365" y="862" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">with-preview needs approval of that exact version.</text>
<text x="365" y="888" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Waiting or blocked teams keep their development slots.</text>
<path d="M365 910 V985" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="990" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="1010" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="1028" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Integrate serially into main</text>
<text x="365" y="1062" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Verify the combined result in one integration worktree.</text>
<text x="365" y="1088" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Preserve project gates and the chosen release mode.</text>
<path d="M365 1110 V1185" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1190" width="610" height="120" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="1210" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="1228" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Record integration; free the slot</text>
<text x="365" y="1262" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Continuous and not held: admit the next safe task.</text>
<text x="365" y="1288" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Refill can proceed before the release batch is ready.</text>
<path d="M365 1310 V1415" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1420" width="610" height="120" rx="18" fill="#E9F8F4" stroke="#CBD8E8" stroke-width="2"/><rect x="61" y="1440" width="5" height="80" rx="2" fill="#2467BC"/>
<text x="365" y="1458" text-anchor="middle" font-size="23" font-weight="700" fill="#13263F">Finish the set or report blockers</text>
<text x="365" y="1492" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Continue active work while it can unblock the queue.</text>
<text x="365" y="1518" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Handle eligible releases, then report actual outcomes.</text>
<rect x="770" y="190" width="300" height="122" rx="18" fill="#FFF6E7" stroke="#E9C88D" stroke-width="2"/>
<text x="920" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#13263F">Help / status</text>
<text x="920" y="257" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Read and report only.</text>
<text x="920" y="283" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">No checks, refill, or releases.</text>
<rect x="770" y="420" width="300" height="122" rx="18" fill="#FFF6E7" stroke="#E9C88D" stroke-width="2"/>
<text x="920" y="454" text-anchor="middle" font-size="20" font-weight="700" fill="#13263F">Settings / setup</text>
<text x="920" y="487" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Reconcile the harness.</text>
<text x="920" y="513" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Numbered choices; no team start.</text>
<rect x="770" y="670" width="300" height="148" rx="18" fill="#FFF6E7" stroke="#E9C88D" stroke-width="2"/>
<text x="920" y="704" text-anchor="middle" font-size="20" font-weight="700" fill="#13263F">Pause / resume</text>
<text x="920" y="737" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Bare commands show a picker.</text>
<text x="920" y="763" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">All holds/restores the run.</text>
<text x="920" y="789" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">A named action targets one team.</text>
<rect x="770" y="980" width="300" height="122" rx="18" fill="#FFF6E7" stroke="#E9C88D" stroke-width="2"/>
<text x="920" y="1014" text-anchor="middle" font-size="20" font-weight="700" fill="#13263F">Held feature</text>
<text x="920" y="1047" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Repair or await approval.</text>
<text x="920" y="1073" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Never replace an occupied slot.</text>
<rect x="770" y="1260" width="300" height="122" rx="18" fill="#FFF6E7" stroke="#E9C88D" stroke-width="2"/>
<text x="920" y="1294" text-anchor="middle" font-size="20" font-weight="700" fill="#13263F">Separate release path</text>
<text x="920" y="1327" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Count top-level tasks.</text>
<text x="920" y="1353" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Keep exact batch boundaries.</text>
<path d="M670 1250 H720 V450 H675" fill="none" stroke="#54759B" stroke-width="3" marker-end="url(#arrow)"/>
<text x="707" y="950" transform="rotate(-90 707 950)" font-size="16" font-weight="700" fill="#137D68">Continuous refill after verified integration</text>
<rect x="150" y="1367" width="430" height="29" rx="4" fill="#F5F8FC"/>
<text x="365" y="1390" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Otherwise: finish or report the hold</text>
<text x="560" y="1600" text-anchor="middle" font-size="17" font-weight="400" fill="#51647B">Project-wide pause holds admissions and releases, including between teams.</text>
<text x="560" y="1630" text-anchor="middle" font-size="16" font-weight="400" fill="#51647B">Exact command, ownership, approval, and recovery rules are in references/.</text>
</g></svg>
