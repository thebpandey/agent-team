name: v9 release candidate

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        required: true
        type: choice
        options: [linux, windows, macos]

permissions:
  contents: read

jobs:
  linux:
    if: inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash v9/tests/install_unix.sh
      - run: python v9/tests/package_release.py linux release-candidate/linux
      - uses: actions/upload-artifact@v4
        with:
          name: v9-linux-${{ github.sha }}
          path: |
            release-candidate/linux/agent-team-skill-9.0.0-linux-any.zip
            release-candidate/linux/agent-team-skill-9.0.0-linux-any.zip.sha256
          if-no-files-found: error

  windows:
    if: inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./v9/tests/install_windows.ps1
      - run: python v9/tests/package_release.py windows release-candidate/windows
      - uses: actions/upload-artifact@v4
        with:
          name: v9-windows-${{ github.sha }}
          path: |
            release-candidate/windows/agent-team-skill-9.0.0-windows-any.zip
            release-candidate/windows/agent-team-skill-9.0.0-windows-any.zip.sha256
          if-no-files-found: error

  macos:
    if: inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash v9/tests/install_unix.sh
      - run: python v9/tests/package_release.py macos release-candidate/macos
      - uses: actions/upload-artifact@v4
        with:
          name: v9-macos-${{ github.sha }}
          path: |
            release-candidate/macos/agent-team-skill-9.0.0-macos-any.zip
            release-candidate/macos/agent-team-skill-9.0.0-macos-any.zip.sha256
          if-no-files-found: error
