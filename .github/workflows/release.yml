name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate tag and package
        run: |
          release_version="$(node -p "JSON.parse(require('fs').readFileSync('hooks/manifest.json')).version")"
          test "${GITHUB_REF_NAME}" = "v${release_version}"
          node --test tests/hooks-*.test.mjs
          node hooks/agent-team-cli.mjs check-package
      - name: Build and verify release archives
        run: |
          node hooks/agent-team-cli.mjs build-artifacts --revision "${GITHUB_SHA}" --output release-artifacts
          node hooks/agent-team-cli.mjs check-artifacts --revision "${GITHUB_SHA}" \
            --archive release-artifacts/agent-team-codex-${GITHUB_REF_NAME#v}.zip \
            --archive release-artifacts/agent-team-claude-${GITHUB_REF_NAME#v}.zip
          cd release-artifacts
          sha256sum *.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --verify-tag --generate-notes --title "Agent-Team ${GITHUB_REF_NAME}"
