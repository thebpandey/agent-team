name: vnext-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-phases:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: mkdir -p release-evidence
        working-directory: vnext
      - run: go test -json ./internal/core -count=1 > release-evidence/phase1-test.json && digest=$(sha256sum release-evidence/phase1-test.json | cut -d' ' -f1) && printf '{"Phase":"phase1","Revision":"%s","Author":"%s","Reviewer":"github-actions/%s","Source":"release-evidence/phase1-test.json","Digest":"%s","Result":"CLEAN"}\n' "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_JOB" "$digest" > release-evidence/phase1-review.json
        working-directory: vnext
      - run: go test -json ./internal/host -count=1 > release-evidence/phase2-test.json && digest=$(sha256sum release-evidence/phase2-test.json | cut -d' ' -f1) && printf '{"Phase":"phase2","Revision":"%s","Author":"%s","Reviewer":"github-actions/%s","Source":"release-evidence/phase2-test.json","Digest":"%s","Result":"CLEAN"}\n' "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_JOB" "$digest" > release-evidence/phase2-review.json
        working-directory: vnext
      - run: go test -json ./internal/capability ./internal/bench -count=1 > release-evidence/phase3-test.json && digest=$(sha256sum release-evidence/phase3-test.json | cut -d' ' -f1) && printf '{"Phase":"phase3","Revision":"%s","Author":"%s","Reviewer":"github-actions/%s","Source":"release-evidence/phase3-test.json","Digest":"%s","Result":"CLEAN"}\n' "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_JOB" "$digest" > release-evidence/phase3-review.json
        working-directory: vnext
      - run: go test -json ./internal/deploy -count=1 > release-evidence/phase4-test.json && digest=$(sha256sum release-evidence/phase4-test.json | cut -d' ' -f1) && printf '{"Phase":"phase4","Revision":"%s","Author":"%s","Reviewer":"github-actions/%s","Source":"release-evidence/phase4-test.json","Digest":"%s","Result":"CLEAN"}\n' "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_JOB" "$digest" > release-evidence/phase4-review.json
        working-directory: vnext
      - run: go test -json ./internal/install ./internal/migrate -count=1 > release-evidence/phase5-test.json && digest=$(sha256sum release-evidence/phase5-test.json | cut -d' ' -f1) && printf '{"Phase":"phase5","Revision":"%s","Author":"%s","Reviewer":"github-actions/%s","Source":"release-evidence/phase5-test.json","Digest":"%s","Result":"CLEAN"}\n' "$GITHUB_SHA" "$GITHUB_ACTOR" "$GITHUB_JOB" "$digest" > release-evidence/phase5-review.json
        working-directory: vnext
      - uses: actions/upload-artifact@v4
        with: { name: vnext-phase-reviews, path: vnext/release-evidence/phase*.json }

  verify-linux:
    needs: verify-phases
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/download-artifact@v4
        with: { name: vnext-phase-reviews, path: vnext/release-evidence }
      - run: go test ./... -count=1
        working-directory: vnext
      - run: go vet ./...
        working-directory: vnext
      - run: mkdir -p release-evidence && go test -json ./... > release-evidence/native-test.json
        working-directory: vnext
      - run: go test -json ./internal/bench > release-evidence/benchmark-test.json
        working-directory: vnext
      - run: go run ./cmd/vnext-release collect-evidence --revision "${GITHUB_SHA}" --out release-evidence --native release-evidence/native-test.json --benchmark release-evidence/benchmark-test.json
        working-directory: vnext
      - uses: actions/upload-artifact@v4
        with: { name: vnext-phase-evidence, path: vnext/release-evidence/* }

  verify-macos:
    needs: verify-linux
    permissions: { contents: read }
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Use canonical test temp
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: go test ./... -count=1
        working-directory: vnext
      - run: go vet ./...
        working-directory: vnext

  verify-windows:
    needs: verify-linux
    permissions: { contents: read }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Use canonical test temp
        shell: bash
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: go test ./... -count=1
        working-directory: vnext
      - run: go vet ./...
        working-directory: vnext

  package:
    needs: [verify-linux, verify-macos, verify-windows]
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go run ./cmd/vnext-release package --version "${{ inputs.version }}" --commit "${GITHUB_SHA}"
        working-directory: vnext
      - run: test "$(jq -r .version release-artifacts/RELEASE.json)" = "${{ inputs.version }}"
        working-directory: vnext
      - uses: actions/upload-artifact@v4
        with: { name: vnext-release-artifacts, path: vnext/release-artifacts/* }

  windows-bundle-canary:
    needs: package
    permissions: { contents: read }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Use canonical test temp
        shell: pwsh
        run: |
          "TMPDIR=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with: { name: vnext-release-artifacts, path: vnext/release-artifacts }
      - name: Verify and install the Windows amd64 bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "vnext/release-artifacts/agent-teamctl-${{ inputs.version }}-windows-amd64.zip"
          $sidecar = "$bundle.sha256"
          $line = Get-Content -Raw $sidecar
          $expected = ((Get-FileHash -Algorithm SHA256 $bundle).Hash).ToLowerInvariant() + "  " + [IO.Path]::GetFileName($bundle) + "`n"
          if ($line -cne $expected) { throw "Windows bundle checksum sidecar does not match" }
          $distribution = Join-Path $env:RUNNER_TEMP "agent-team-windows-amd64"
          Expand-Archive -LiteralPath $bundle -DestinationPath $distribution
          $fixtureHome = Join-Path $env:RUNNER_TEMP "root-skill-home"
          $env:HOME = $fixtureHome
          $env:USERPROFILE = $fixtureHome
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "local-app-data"
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-home"
          $env:CLAUDE_HOME = Join-Path $env:RUNNER_TEMP "claude-home"
          $staleRoot = Join-Path $fixtureHome ".codex/skills/agent-team"
          $staleSkill = Join-Path $staleRoot "SKILL.md"
          New-Item -ItemType Directory -Force -Path $staleRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "SKILL.md") -Destination $staleSkill
          $rootSkill = Get-Content -Raw $staleSkill
          if ($rootSkill -notmatch "version: `"${{ inputs.version }}`"") { throw "Source-root skill version does not match release input" }
          $route = 'Route `setup`, `status`, and `start` through the installed native `agent-teamctl` contract.'
          if (-not $rootSkill.Contains($route)) { throw "Source-root skill does not route to native contract" }
          $conflict = & (Join-Path $distribution "agent-teamctl.exe") install --host both --json 2>&1
          $conflictExit = $LASTEXITCODE
          $conflictJSON = $conflict | ConvertFrom-Json
          if ($conflictExit -eq 0 -or $conflictJSON.ok -ne $false -or -not $conflictJSON.error.Contains($staleSkill) -or -not $conflictJSON.error.Contains("recoverable backup outside discovery paths and retry")) { throw "Windows source-root conflict was not rejected: $conflict" }
          $manifestRoot = Join-Path $env:LOCALAPPDATA "AgentTeam"
          if (Test-Path -LiteralPath $manifestRoot) { throw "Conflict created native files" }
          Move-Item -LiteralPath $staleRoot -Destination (Join-Path $env:RUNNER_TEMP "retired-root-skill")
          $result = & (Join-Path $distribution "agent-teamctl.exe") install --host both --json
          if ($LASTEXITCODE -ne 0) { throw "Windows bundle installer failed: $result" }
          $json = $result | ConvertFrom-Json
          if (-not $json.ok -or $json.action -ne "install") { throw "Windows bundle installer returned unexpected JSON: $result" }
          $installedController = Join-Path $manifestRoot "bin/agent-teamctl.exe"
          $nativeRaw = & $installedController version --json
          $nativeExit = $LASTEXITCODE
          if ($nativeExit -ne 0) { throw "Installed Windows controller version failed: $nativeRaw" }
          $native = $nativeRaw | ConvertFrom-Json
          if ($native.schema -ne 1 -or $native.version -ne "${{ inputs.version }}" -or $native.revision -ne "${{ github.sha }}") { throw "Installed Windows native identity does not match release input" }
          $installedManifest = Get-Content -Raw (Join-Path $manifestRoot "install-manifest.json") | ConvertFrom-Json
          $hostHomes = @{ codex = $env:CODEX_HOME; claude = $env:CLAUDE_HOME }
          foreach ($hostName in $hostHomes.Keys) {
            $hostHome = $hostHomes[$hostName]
            $skillPath = Join-Path $hostHome "skills/agent-team/SKILL.md"
            $installedSkill = Get-Content -Raw $skillPath
            if ($installedSkill -notmatch "version: `"${{ inputs.version }}`"") { throw "Installed $hostName entrypoint version does not match release input" }
            $entrypoint = @($installedManifest.files | Where-Object { $_.role -eq "skill-entrypoint" -and $_.host -eq $hostName })
            if ($entrypoint.Count -ne 1) { throw "Installed $hostName entrypoint ownership is ambiguous" }
            if ([IO.Path]::GetFullPath($entrypoint[0].path) -cne [IO.Path]::GetFullPath($skillPath)) { throw "Installed $hostName entrypoint manifest path does not match discovery path" }
            $skillDigest = (Get-FileHash -Algorithm SHA256 $skillPath).Hash.ToLowerInvariant()
            if ($skillDigest -cne $entrypoint[0].sha256 -or (Get-Item -LiteralPath $skillPath).Length -ne $entrypoint[0].bytes) { throw "Installed $hostName entrypoint bytes do not match ownership" }
            $nestedSkill = Join-Path $hostHome "skills/agent-team/agent-team-vnext/SKILL.md"
            if (Test-Path -LiteralPath $nestedSkill) { throw "Installed $hostName entrypoint remains nested" }
          }
      - name: Exercise extracted controller native-action protocol
        shell: pwsh
        working-directory: vnext
        run: |
          $env:VNEXT_RELEASE_BINARY = Join-Path $env:RUNNER_TEMP "agent-team-windows-amd64/agent-teamctl.exe"
          go test ./cmd/agent-teamctl -run '^TestPackagedNativeActions$' -count=1 -v

  canary:
    needs: [package, windows-bundle-canary]
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/download-artifact@v4
        with: { name: vnext-release-artifacts, path: vnext/release-artifacts }
      - uses: actions/download-artifact@v4
        with: { name: vnext-phase-evidence, path: vnext/release-evidence }
      - run: sha256sum -c SHA256SUMS
        working-directory: vnext/release-artifacts
      - run: go test ./internal/release -run 'Test(CodexCanary|ClaudeCanary|BothHostsRollbackAndActions|ArchiveCanaryFixture|PackagedArchiveCanary|Cutover|FinalGate|ReleasePackageOutputs)' -count=1
        working-directory: vnext
      - run: go test ./internal/deploy -run '^TestProviderVerification$' -count=1
        working-directory: vnext
      - run: go test -json ./internal/release -run 'Test(CodexCanary|ClaudeCanary|PackagedArchiveCanary|Cutover)' -count=1 > release-evidence/canary-test.json
        env:
          VNEXT_RELEASE_ARCHIVE: ${{ github.workspace }}/vnext/release-artifacts/agent-teamctl-${{ inputs.version }}.zip
          VNEXT_RELEASE_MANIFEST: ${{ github.workspace }}/vnext/release-artifacts/RELEASE.json
        working-directory: vnext
      - run: go test -json ./internal/release -run '^TestBothHostsRollbackAndActions$' -count=1 > release-evidence/rollback-test.json
        working-directory: vnext
      - run: go test -json ./internal/deploy -run '^TestProviderVerification$' -count=1 > release-evidence/provider-test.json
        working-directory: vnext
      - name: Verify final archive upgrade, rollback, reupdate, retry and uninstall
        run: go test -json ./internal/release -run '^TestPackagedArchiveCanary$' -count=1 > release-evidence/installed-test.json
        env:
          VNEXT_RELEASE_ARCHIVE: ${{ github.workspace }}/vnext/release-artifacts/agent-teamctl-${{ inputs.version }}.zip
          VNEXT_RELEASE_MANIFEST: ${{ github.workspace }}/vnext/release-artifacts/RELEASE.json
        working-directory: vnext
      - run: go run ./cmd/vnext-release finalize-evidence --revision "${GITHUB_SHA}" --out release-evidence --artifact release-artifacts/RELEASE.json --sbom release-artifacts/SBOM.cdx.json --canary release-evidence/canary-test.json --rollback release-evidence/rollback-test.json --provider release-evidence/provider-test.json --installed release-evidence/installed-test.json
        working-directory: vnext
      - run: go run ./cmd/vnext-release write-readiness --revision "${GITHUB_SHA}" --gates release-evidence/release-gates.json --benchmark release-evidence/benchmark.json --artifact release-artifacts/RELEASE.json --sbom release-artifacts/SBOM.cdx.json --canary release-evidence/canary.json --rollback release-evidence/rollback.json --provider release-evidence/provider.json --installed release-evidence/installed-skill.json
        working-directory: vnext
      - uses: actions/upload-artifact@v4
        with:
          name: vnext-release-readiness
          path: |
            vnext/release-readiness.json
            vnext/release-evidence/*
            vnext/release-artifacts/*

  publish:
    needs: [verify-linux, verify-macos, verify-windows, package, windows-bundle-canary, canary]
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/download-artifact@v4
        with: { name: vnext-release-readiness, path: vnext }
      - run: sha256sum -c SHA256SUMS
        working-directory: vnext/release-artifacts
      - run: go run ./cmd/vnext-release verify-gates --evidence release-readiness.json --revision "${GITHUB_SHA}"
        working-directory: vnext
      - run: |
          test "$(jq -r .version vnext/release-artifacts/RELEASE.json)" = "${{ inputs.version }}"
          test "$(jq -r .commit vnext/release-artifacts/RELEASE.json)" = "${GITHUB_SHA}"
          git fetch --tags
          ! git rev-parse --verify --quiet "refs/tags/v${{ inputs.version }}"
          git push origin main
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a "v${{ inputs.version }}" -m "Agent-Team v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "v${{ inputs.version }}", files: vnext/release-artifacts/*, generate_release_notes: true }
